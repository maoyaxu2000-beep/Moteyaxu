<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111d33">
<meta name="robots" content="noindex, nofollow">
<title>五班英语角 · 空保执勤英语</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* 首屏绘制前先定好深浅色；顺便把运行中的脚本错误和资源加载失败记到本机（关于与诊断页可复制） */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem('theme') || '"auto"');
    var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
  function log(m){ try{ var a = JSON.parse(localStorage.getItem('wbErr') || '[]'); a.push({ t: Date.now(), m: String(m).slice(0, 300) }); localStorage.setItem('wbErr', JSON.stringify(a.slice(-30))); }catch(e){} }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t !== window && (t.src || t.href)) log('加载失败：' + (t.src || t.href).split('/').slice(-2).join('/'));
    else log((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  }, true);
  window.addEventListener('unhandledrejection', function(e){ log('promise：' + ((e.reason && e.reason.message) || e.reason)); });
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <button class="back" onclick="goBack()">‹</button>
    <div class="title" id="topTitle">五班英语角</div>
    <div class="act" id="topAct"></div>
  </div>
  <div id="root"></div>
</div>

<div class="tabbar" id="tabbar"></div>

<div class="toast" id="toast"></div>

<!-- 首屏占位：浏览器一拿到页面就有画面，不再先白屏等脚本；lock.js 接手后替换内容 -->
<div id="gate"><div class="gate-card"><img class="gate-logo" src="icon.svg" alt=""><div class="gate-sub" style="margin-top:20px">正在加载…</div></div></div>

<!-- 学习内容与语音都是加密的：lock.js 验证邀请码、解密后再加载 app.js / engine.js / drills.js -->
<script src="audio/gb.js" async></script>
<script src="audio/us.js" async></script>
<script src="audio/gb2.js" async></script>
<script src="audio/us2.js" async></script>
<script src="icons.js"></script>
<script src="lock.js"></script>
<script>
/* 静态资源是缓存优先，原来更新内容后学员要打开两次才看到新版。
   这里监听到新版本就地提示，点确定立即刷新。 */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            if(confirm('学习内容有更新，是否立即刷新？')){
              nw.postMessage({type:'SKIP_WAITING'});
              location.reload();
            }
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
