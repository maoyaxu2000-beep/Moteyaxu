<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a7f37">
<title>五班英语角</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --green:#1a7f37; --green2:#22c55e; --green-d:#15803d;
  --blue:#1a5276; --navy:#1e3a5f;
  --bg:#f4f6f8; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#eef0f2;
  --shadow:0 6rem 20rem rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:0.133333vw;} /* 1rem ≈ 1rem（750 设计稿）= 屏宽/750 */
@media(min-width:520px){html{font-size:0.69333px;}} /* 居中后按 520 宽锁定 */
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;
  padding-bottom:calc(140rem + env(safe-area-inset-bottom));}
.app{max-width:520px;margin:0 auto;min-height:100vh;}
img{max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hidden{display:none!important;}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;
  height:88rem;padding:0 24rem;padding-top:env(safe-area-inset-top);
  border-bottom:1rem solid var(--line);}
.topbar .back{font-size:40rem;width:56rem;height:56rem;display:none;align-items:center;justify-content:center;
  border-radius:50%;font-size:30px;line-height:1;color:#111;}
.topbar.sub .back{display:flex;}
.topbar .title{font-size:17px;font-weight:600;flex:1;text-align:center;}
.topbar .title.left{text-align:left;}
.topbar .act{min-width:56rem;text-align:right;font-size:13px;color:var(--green);}

/* ===== Views ===== */
.view{padding:24rem;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8rem)}to{opacity:1;transform:none}}

/* ===== Home ===== */
.welcome-card{position:relative;overflow:hidden;border-radius:28rem;padding:36rem 32rem;color:#fff;
  background:linear-gradient(135deg,#1e3a5f 0%,#1a5276 45%,#1a7f37 100%);box-shadow:0 14rem 34rem rgba(26,127,55,.28);}
.welcome-top{display:flex;justify-content:space-between;align-items:flex-start;}
.welcome-user{display:flex;align-items:center;gap:20rem;}
.welcome-avatar{width:92rem;height:92rem;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:38rem;font-weight:700;overflow:hidden;}
.welcome-greeting{font-size:17px;font-weight:600;}
.welcome-status{display:flex;align-items:center;gap:8rem;font-size:12px;opacity:.9;margin-top:6rem;}
.status-dot{width:14rem;height:14rem;border-radius:50%;background:#fbbf24;}
.status-dot.done{background:#4ade80;}
.welcome-date{text-align:center;}
.date-day{display:block;font-size:30px;font-weight:700;line-height:1;}
.date-week{font-size:11px;opacity:.85;}
.welcome-stats{display:flex;align-items:center;justify-content:space-around;margin-top:32rem;
  background:rgba(255,255,255,.12);border-radius:20rem;padding:22rem 0;}
.stat-item{text-align:center;flex:1;}
.stat-num{display:block;font-size:24px;font-weight:700;}
.stat-label{font-size:11px;opacity:.85;}
.stat-dot{width:2rem;height:48rem;background:rgba(255,255,255,.2);}

/* quick grid */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18rem;margin-top:30rem;}
.quick-item{background:var(--card);border-radius:22rem;padding:22rem 6rem;text-align:center;box-shadow:var(--shadow);}
.quick-icon{width:84rem;height:84rem;border-radius:24rem;margin:0 auto 12rem;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:34rem;}
.quick-name{display:block;font-size:13px;font-weight:600;}
.quick-desc{display:block;font-size:10px;color:var(--muted);margin-top:2rem;}

/* section */
.section{margin-top:38rem;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18rem;}
.section-head-left{display:flex;align-items:center;gap:14rem;}
.section-head-bar{width:8rem;height:30rem;border-radius:4rem;background:var(--green);}
.section-head-bar.amber{background:#f59e0b;} .section-head-bar.green{background:#22c55e;}
.section-title{font-size:16px;font-weight:700;}
.section-sub{font-size:11px;color:var(--muted);}

.func-card{background:var(--card);border-radius:24rem;box-shadow:var(--shadow);overflow:hidden;}
.func-item{display:flex;align-items:center;gap:22rem;padding:26rem 28rem;}
.func-icon{width:84rem;height:84rem;border-radius:22rem;display:flex;align-items:center;justify-content:center;font-size:38rem;flex-shrink:0;}
.func-info{flex:1;min-width:0;}
.func-name{font-size:15px;font-weight:600;display:block;}
.func-desc{font-size:11px;color:var(--muted);}
.func-badge{background:#ef4444;color:#fff;font-size:9px;padding:3rem 10rem;border-radius:20rem;font-weight:700;}
.func-arrow{color:#cbd5e1;font-size:24px;}
.func-divider{height:1rem;background:var(--line);margin:0 28rem;}

/* daily */
.daily-list{display:grid;grid-template-columns:1fr 1fr;gap:18rem;}
.daily-card{border-radius:24rem;padding:26rem;box-shadow:var(--shadow);color:#fff;min-height:200rem;}
.word-card{background:linear-gradient(135deg,#34d399,#059669);}
.phrase-card{background:linear-gradient(135deg,#60a5fa,#2563eb);}
.daily-card-tag{display:inline-flex;align-items:center;gap:6rem;background:rgba(255,255,255,.22);
  border-radius:20rem;padding:5rem 14rem;font-size:10px;font-weight:600;}
.daily-card-word{font-size:21px;font-weight:700;margin-top:18rem;}
.daily-card-phonetic{font-size:11px;opacity:.85;margin-top:4rem;}
.daily-card-meaning{font-size:13px;margin-top:8rem;}
.daily-card-example{font-size:11px;opacity:.9;margin-top:10rem;font-style:italic;}
.daily-card-en{font-size:15px;font-weight:600;margin-top:18rem;}
.daily-card-cn{font-size:12px;opacity:.92;margin-top:8rem;}

/* checkin week */
.checkin-card{background:var(--card);border-radius:24rem;padding:30rem 26rem;box-shadow:var(--shadow);}
.week-row{display:flex;justify-content:space-between;margin-bottom:26rem;}
.week-day{display:flex;flex-direction:column;align-items:center;gap:10rem;}
.week-label{font-size:11px;color:var(--muted);}
.week-dot{width:56rem;height:56rem;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;}
.week-day.done .week-dot{background:var(--green2);}
.week-day.today .week-label{color:var(--green);font-weight:700;}
.week-day.today .week-dot{box-shadow:0 0 0 4rem rgba(34,197,94,.25);}
.btn{display:block;width:100%;text-align:center;border-radius:18rem;padding:26rem;font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--green2),var(--green));}
.btn.done{background:#e8f5ee;color:var(--green);}
.btn.ghost{background:#fff;color:var(--text);border:1rem solid var(--line);}
.btn.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b);}

/* setting */
.card{background:var(--card);border-radius:22rem;padding:24rem;box-shadow:var(--shadow);}
.setting-row{display:flex;align-items:center;gap:14rem;}
.setting-row input{flex:1;border:1rem solid var(--line);border-radius:14rem;padding:16rem;font-size:14px;background:#f8fafc;}
.setting-save{background:var(--green);color:#fff;border-radius:14rem;padding:16rem 26rem;font-size:13px;}
.links{display:flex;justify-content:center;gap:12rem;color:var(--muted);font-size:12px;margin-top:28rem;}
.links span{cursor:pointer;}

/* ===== Bottom nav ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1rem solid var(--line);
  display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;text-align:center;padding:12rem 0 14rem;color:var(--muted);font-size:10px;}
.tab .ic{font-size:22px;display:block;line-height:1.2;}
.tab.active{color:var(--green);}

/* ===== Lists / category chips ===== */
.chips{display:flex;gap:14rem;overflow-x:auto;padding:4rem 0 18rem;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:12rem 24rem;border-radius:40rem;background:#fff;border:1rem solid var(--line);
  font-size:13px;color:var(--muted);white-space:nowrap;}
.chip.active{background:var(--green);color:#fff;border-color:var(--green);}

.list-item{background:var(--card);border-radius:20rem;padding:24rem 26rem;box-shadow:var(--shadow);margin-bottom:18rem;display:flex;align-items:center;gap:18rem;}
.li-main{flex:1;min-width:0;}
.li-en{font-size:15px;font-weight:600;}
.li-cn{font-size:12px;color:var(--muted);margin-top:6rem;}
.li-title{font-size:11px;color:#94a3b8;margin-bottom:6rem;}
.play{width:64rem;height:64rem;border-radius:50%;background:#e8f5ee;color:var(--green);display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;}
.play:active{transform:scale(.92);}
.arrow-item{justify-content:space-between;}
.arrow-item .func-arrow{color:#cbd5e1;font-size:24px;}

/* ===== Words flashcard ===== */
.flash{background:var(--card);border-radius:30rem;box-shadow:var(--shadow);padding:48rem 36rem;text-align:center;margin-top:10rem;min-height:430rem;
  display:flex;flex-direction:column;justify-content:center;}
.flash-cat{display:inline-block;align-self:center;background:#e8f5ee;color:var(--green);font-size:11px;padding:6rem 18rem;border-radius:30rem;margin-bottom:24rem;}
.flash-word{font-size:30px;font-weight:800;letter-spacing:.5rem;}
.flash-ph{font-size:14px;color:var(--muted);margin-top:12rem;}
.flash-play{margin:24rem auto 0;width:96rem;height:96rem;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));
  color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 10rem 24rem rgba(26,127,55,.3);}
.flash-reveal{margin-top:30rem;}
.flash-meaning{font-size:20px;font-weight:700;}
.flash-eg{font-size:13px;color:#475569;margin-top:16rem;}
.flash-eg-cn{font-size:12px;color:var(--muted);margin-top:6rem;}
.tap-hint{font-size:12px;color:#cbd5e1;margin-top:24rem;}
.flash-actions{display:flex;gap:18rem;margin-top:24rem;}
.flash-actions .btn{padding:24rem;}
.progress-bar{height:10rem;background:#eef2f6;border-radius:10rem;overflow:hidden;margin:6rem 0 20rem;}
.progress-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .3s;}
.progress-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6rem;}

/* ===== Quiz ===== */
.quiz-opt{background:var(--card);border:2rem solid var(--line);border-radius:18rem;padding:24rem 26rem;margin-bottom:16rem;font-size:15px;
  display:flex;align-items:center;gap:16rem;transition:.15s;}
.quiz-opt .idx{width:48rem;height:48rem;border-radius:12rem;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.quiz-opt.correct{border-color:var(--green2);background:#ecfdf3;}
.quiz-opt.correct .idx{background:var(--green2);color:#fff;}
.quiz-opt.wrong{border-color:#f87171;background:#fef2f2;}
.quiz-opt.wrong .idx{background:#f87171;color:#fff;}
.quiz-q{background:var(--card);border-radius:24rem;box-shadow:var(--shadow);padding:40rem 30rem;text-align:center;margin-bottom:26rem;}
.quiz-q .qw{font-size:26px;font-weight:800;}
.quiz-q .qp{font-size:13px;color:var(--muted);margin-top:10rem;}
.seg{display:flex;background:#f1f5f9;border-radius:16rem;padding:6rem;margin-bottom:20rem;}
.seg button{flex:1;padding:16rem;border-radius:12rem;font-size:13px;color:var(--muted);font-weight:600;}
.seg button.active{background:#fff;color:var(--green);box-shadow:0 2rem 6rem rgba(0,0,0,.06);}
.result-ring{width:220rem;height:220rem;border-radius:50%;margin:10rem auto 24rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;background:conic-gradient(var(--green2) var(--pct),#e5e7eb 0);}
.result-ring .inner{width:170rem;height:170rem;border-radius:50%;background:#fff;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.result-score{font-size:40px;font-weight:800;color:var(--green);}
.field{margin-bottom:22rem;}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:12rem;}

/* dialogue bubbles */
.bubble{max-width:78%;padding:20rem 24rem;border-radius:22rem;margin-bottom:18rem;font-size:14px;position:relative;}
.bubble .cn{font-size:12px;opacity:.7;margin-top:8rem;}
.bubble.left{background:#fff;border:1rem solid var(--line);border-bottom-left-radius:6rem;}
.bubble.right{background:#dcf5e3;margin-left:auto;border-bottom-right-radius:6rem;}
.bubble .b-play{position:absolute;bottom:8rem;right:-72rem;width:52rem;height:52rem;border-radius:50%;background:#e8f5ee;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;}
.bubble.right .b-play{right:auto;left:-72rem;}
.role-tag{font-size:10px;color:#94a3b8;margin-bottom:6rem;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;gap:16rem;}
.chat-msg{max-width:82%;padding:18rem 22rem;border-radius:20rem;font-size:14px;}
.chat-msg.bot{background:#fff;border:1rem solid var(--line);align-self:flex-start;border-bottom-left-radius:6rem;}
.chat-msg.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:6rem;}
.chat-bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  display:flex;gap:12rem;padding:16rem 24rem;background:#fff;border-top:1rem solid var(--line);}
.chat-bar input{flex:1;border:1rem solid var(--line);border-radius:40rem;padding:18rem 24rem;font-size:14px;background:#f8fafc;}
.chat-bar button{background:var(--green);color:#fff;border-radius:40rem;padding:0 30rem;font-size:14px;font-weight:600;}
.chat-result{background:#f8fafc;border-radius:14rem;padding:14rem 18rem;margin-top:12rem;}
.chat-result .li-en{font-size:14px;} .chat-result .li-cn{font-size:11px;}

.empty{text-align:center;color:var(--muted);padding:80rem 30rem;font-size:13px;}
.empty .big{font-size:60rem;display:block;margin-bottom:16rem;}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.88);color:#fff;
  padding:22rem 34rem;border-radius:16rem;font-size:14px;z-index:99;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;}
.safe{height:40rem;}
.part-title{font-size:15px;font-weight:700;margin:30rem 0 16rem;display:flex;align-items:center;gap:12rem;}
.part-title .en{font-size:11px;color:var(--muted);font-weight:400;}
.sec-cat{background:#fff;border-radius:18rem;box-shadow:var(--shadow);padding:24rem 26rem;margin-bottom:16rem;display:flex;justify-content:space-between;align-items:center;}
.sec-cat .nm{font-size:14px;font-weight:600;}
.sec-cat .en{font-size:11px;color:var(--muted);}
.badge-cnt{font-size:11px;color:var(--green);background:#e8f5ee;border-radius:20rem;padding:4rem 12rem;}
.qa-item{background:#fff;border-radius:18rem;box-shadow:var(--shadow);padding:22rem 24rem;margin-bottom:16rem;}
.qa-q{display:flex;gap:12rem;}
.qa-a{display:flex;gap:12rem;margin-top:14rem;padding-top:14rem;border-top:1rem dashed var(--line);}
.qa-badge{width:40rem;height:40rem;border-radius:10rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.qa-badge.q{background:var(--blue);} .qa-badge.a{background:var(--green);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <button class="back" onclick="goBack()">‹</button>
    <div class="title" id="topTitle">五班英语角</div>
    <div class="act" id="topAct"></div>
  </div>
  <div id="root"></div>
</div>

<div class="tabbar" id="tabbar">
  <div class="tab active" data-tab="home" onclick="switchTab('home')"><span class="ic">🏠</span>首页</div>
  <div class="tab" data-tab="words" onclick="switchTab('words')"><span class="ic">📖</span>背单词</div>
  <div class="tab" data-tab="speaking" onclick="switchTab('speaking')"><span class="ic">💬</span>口语</div>
  <div class="tab" data-tab="security" onclick="switchTab('security')"><span class="ic">🛡️</span>空保</div>
  <div class="tab" data-tab="me" onclick="switchTab('me')"><span class="ic">👤</span>我的</div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
